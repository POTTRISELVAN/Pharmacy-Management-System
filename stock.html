<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Management - PharmaCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-clinic-medical"></i>
            <h2>PharmaCare</h2>
        </div>
        <nav>
            <a href="index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="medicine.html" class="nav-item"><i class="fas fa-pills"></i> Medicine Master</a>
            <a href="stock.html" class="nav-item active"><i class="fas fa-boxes"></i> Stock Management</a>
            <a href="billing.html" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> Billing</a>
            <a href="reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> Reports</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-boxes"></i> Stock Management</h1>
            <button class="btn btn-primary" onclick="showAddForm()">
                <i class="fas fa-plus"></i> Add Stock
            </button>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- Add Stock Form -->
        <div class="card" id="addForm" style="display:none; margin:20px 25px;">
            <div class="card-header">
                <h3>Add New Stock</h3>
                <button class="modal-close" onclick="hideAddForm()">✕</button>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Medicine *</label>
                    <input type="text" id="medicineSearch" placeholder="Search medicine..."
                        oninput="searchMedicineForStock(this.value)" autocomplete="off">
                    <input type="hidden" id="stockMedicineId">
                    <div id="stockSearchResults" style="position:relative;">
                        <div id="stockDropdown" style="display:none; position:absolute; background:white; border:1px solid #ddd; border-radius:8px; width:100%; max-height:150px; overflow-y:auto; z-index:999; box-shadow:0 4px 10px rgba(0,0,0,0.1);"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Batch Number *</label>
                    <input type="text" id="batchNumber" placeholder="e.g., BT2024001">
                </div>
                <div class="form-group">
                    <label>Expiry Date *</label>
                    <input type="date" id="expiryDate">
                </div>
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" id="quantity" placeholder="0" min="1">
                </div>
                <div class="form-group">
                    <label>Purchase Price</label>
                    <input type="number" id="purchasePrice" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Selling Price</label>
                    <input type="number" id="sellingPrice" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>MRP</label>
                    <input type="number" id="mrp" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Supplier Name</label>
                    <input type="text" id="supplierName" placeholder="Supplier name">
                </div>
                <div class="form-group">
                    <label>Purchase Date</label>
                    <input type="date" id="purchaseDate">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="addStock()">
                    <i class="fas fa-save"></i> Save Stock
                </button>
                <button class="btn" onclick="hideAddForm()" style="background:#eee">Cancel</button>
            </div>
        </div>

        <!-- Stock Table -->
        <div class="card" style="margin:0 25px 25px;">
            <div class="card-header">
                <h3>Stock List</h3>
                <input type="text" placeholder="🔍 Search medicine..."
                    style="padding:8px 12px; border:1px solid #ddd; border-radius:8px; width:250px;"
                    oninput="searchStock(this.value)">
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Medicine</th>
                        <th>Batch No</th>
                        <th>Expiry Date</th>
                        <th>Quantity</th>
                        <th>Selling Price</th>
                        <th>MRP</th>
                        <th>Supplier</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="stockTable">
                    <tr><td colspan="9" style="text-align:center;padding:30px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/stock.js"></script>
</body>
</html>
