<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Pharmacy Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-clinic-medical"></i>
            <h2>PharmaCare</h2>
        </div>
        <nav>
            <a href="index.html" class="nav-item active">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
            <a href="medicine.html" class="nav-item">
                <i class="fas fa-pills"></i> Medicine Master
            </a>
            <a href="stock.html" class="nav-item">
                <i class="fas fa-boxes"></i> Stock Management
            </a>
            <a href="billing.html" class="nav-item">
                <i class="fas fa-file-invoice-dollar"></i> Billing
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-chart-bar"></i> Reports
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <h1>Dashboard</h1>
            <div class="date-time" id="dateTime"></div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card blue">
                <i class="fas fa-pills"></i>
                <div>
                    <h3 id="totalMedicines">0</h3>
                    <p>Total Medicines</p>
                </div>
            </div>
            <div class="stat-card green">
                <i class="fas fa-boxes"></i>
                <div>
                    <h3 id="totalStock">0</h3>
                    <p>Stock Items</p>
                </div>
            </div>
            <div class="stat-card orange">
                <i class="fas fa-exclamation-triangle"></i>
                <div>
                    <h3 id="lowStock">0</h3>
                    <p>Low Stock Alert</p>
                </div>
            </div>
            <div class="stat-card red">
                <i class="fas fa-calendar-times"></i>
                <div>
                    <h3 id="expiringSoon">0</h3>
                    <p>Expiring in 30 Days</p>
                </div>
            </div>
        </div>

        <!-- Recent Bills -->
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-receipt"></i> Recent Bills</h3>
                <a href="billing.html" class="btn-small">New Bill</a>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Bill No</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Payment</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="recentBillsTable">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
